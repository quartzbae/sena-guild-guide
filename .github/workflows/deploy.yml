name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v6

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
