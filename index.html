<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      CSP — 토큰이 localStorage 에 있어서, XSS 가 하나라도 뚫리면 그대로 계정이 넘어간다.
      그 한 방을 무해하게 만드는 안전망이다. 허용한 바깥 출처는 jsdelivr 하나뿐:
      본문 폰트(Pretendard)와 캡처 판독 폴백(tesseract.js — 워커·wasm·학습데이터)이 거기서 온다.
      frame-ancestors 는 meta 로는 안 걸린다(응답 헤더 전용) — GitHub Pages 라 방법이 없다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'none';
               script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
               style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
               font-src 'self' data: https://cdn.jsdelivr.net;
               img-src 'self' data: blob:;
               worker-src 'self' blob:;
               connect-src 'self' data: blob: https://cdn.jsdelivr.net https://sena-guild-search.ericalapiestral.workers.dev"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8f5f4" />
    <title>붕붕단 · 세나 리버스 길드</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
